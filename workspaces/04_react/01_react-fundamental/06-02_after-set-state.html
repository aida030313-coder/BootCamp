<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <!-- 
        setState 이후 특정 작업 실행하기
        setState 실행 이후 특정한 작업을 실행하고 싶을 때,
        두 번째 인자로 콜백함수를 전달하여 처리할 수 있다.
     -->

    <div id="root"></div>
    <script type="text/babel">
        class Light extends React.Component {

            state= {
                // 불이 꺼진 상태로 초기화
                isOn: false
            };

            render() {

                const { isOn } = this.state;

                const style = {
                    width: 200,
                    height: 200,
                    backgroundColor: isOn ? 'orange' : 'gray',
                    transition: '1s'
                }
                
                return (
                    <>
                        <div style={style}></div>
                        <button onClick = {
                            () => {
                                this.setState(
                                    {isOn: !isOn},
                                    // setState의 두 번째 인자로 함수를 전달하면, 상태 업데이트 후 해당 함수가 실행된다.
                                () => console.log(!isOn ? '불이 켜졌습니다.' : '불이 꺼졌습니다.')
                                );
                            }
                        }>{isOn ? 'OFF' : 'ON'}</button>
                    </>
                );
            }
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<Light/>);
    </script>
</body>
</html>
