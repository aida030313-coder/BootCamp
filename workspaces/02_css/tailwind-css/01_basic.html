<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 p-10">
    <!-- <h1 class="text-3xl font-bold text-center text-cyan-500">안녕하세요</h1> -->
    
    <h1 class="text-3xl font-bold text-center text-cyan-500">
        기본 유틸리티 & 상태
    </h1>

    <div class="
        bg-white
        rounded-xl
        shadow-lg
        mt-10
        p-8
        max-w-xl
        mx-auto  
    ">
        <h2 class="text-2xl font-bold text-gray-500">
            Tailwind CSS 기본 유틸리티
        </h2>
        <p class="mt-2 text-lime-600">
            제목 간의 간격 주기
        </p>
        <p class="mt-6 text-red-400 leading-relaxed">
            카드 중앙에 배치 <br/>
            배경 색상과 그림자 효과 <br/>
            줄 간격 조절
        </p>
    </div>

    <div class="mt-10 text-center">
        <button class="
            bg-teal-400
            rounded-lg
            text-teal-900
            font-bold
            text-lg
            px-8
            py-3
            shadow-md

            w-full md:w-1/2

            hover:bg-teal-600
            hover:shadow-lg
            focus:ring-4
            focus:ring-yellow-200
            transition-all
        ">
            버튼
        </button>
    </div>
</body>
</html>
